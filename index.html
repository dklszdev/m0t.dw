<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & Meta Tags -->
    <title>m0t.dw | Cloud Storage Seguro</title>
    <meta name="description" content="Almacenamiento en la nube de alta velocidad creado por AdrianodevSP.">
    <meta name="robots" content="noindex, nofollow"> <!-- Oculto temporalmente hasta que esté listo -->
    
    <!-- Estilos e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla de Carga (Loader) -->
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <!-- PANTALLA 1: LOGIN -->
    <section id="login-screen" class="screen-container">
        <div class="glass-panel">
            <div class="logo-big">m0t.dw</div>
            <p class="subtitle">Cloud Híbrido de Alta Velocidad</p>
            
            <button id="btn-login" class="btn-google">
                <i class="fab fa-google"></i> Acceder con Google
            </button>

            <div class="credits-login">
                Creado por <span class="dev-name">AdrianodevSP</span>
            </div>
        </div>
    </section>

    <!-- PANTALLA 2: DASHBOARD (Panel Principal) -->
    <section id="dashboard" class="screen-container" style="display: none;">
        <nav class="navbar">
            <div class="nav-brand">m0t.dw <span class="badge">BETA</span></div>
            <div class="nav-user">
                <span id="user-name">Usuario</span>
                <img id="user-photo" src="" alt="Avatar">
                <button id="btn-logout" title="Cerrar Sesión"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </nav>

        <main class="container">
            <!-- Zona de Subida -->
            <div class="upload-card">
                <div class="drop-zone" id="drop-zone">
                    <div class="icon-cloud"><i class="fas fa-cloud-upload-alt"></i></div>
                    <h3>Subir Archivo</h3>
                    <p>Soporte para archivos grandes (+5GB)</p>
                    <button class="btn-select" onclick="document.getElementById('file-input').click()">Elegir Archivo</button>
                    <input type="file" id="file-input" hidden>
                </div>

                <!-- Barra de Progreso -->
                <div class="upload-status" id="upload-status" style="display: none;">
                    <div class="status-header">
                        <span id="status-text">Subiendo...</span>
                        <span id="status-percent">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-bar"></div>
                    </div>
                </div>
            </div>

            <!-- Lista de Archivos -->
            <div class="files-section">
                <div class="section-header">
                    <h2><i class="fas fa-hdd"></i> Mis Archivos</h2>
                    <span id="file-count">0 archivos</span>
                </div>
                <ul id="file-list" class="file-list">
                    <!-- JS inyectará archivos aquí -->
                </ul>
            </div>
        </main>
        
        <footer class="dashboard-footer">
            Sistema desarrollado por <strong>AdrianodevSP</strong>
        </footer>
    </section>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
