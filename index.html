<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & Meta Tags -->
    <title>m0t.dw | Cloud Storage Seguro y Rápido</title>
    <meta name="description" content="m0t.dw ofrece almacenamiento en la nube ilimitado de alta velocidad. Sube archivos de hasta 5GB, comparte y descarga sin esperas.">
    <meta name="keywords" content="cloud, almacenamiento, drive, subida de archivos, descarga directa, m0t, m0t.dw, file hosting">
    <meta name="robots" content="index, follow">
    <meta name="author" content="m0t Team">
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://m0t.dw/">
    <meta property="og:title" content="m0t.dw - Tu Nube Personal">
    <meta property="og:description" content="Sube y comparte archivos grandes al instante. Sin límites de velocidad.">
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/2333/2333097.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="m0t.dw - Cloud Storage">
    <meta property="twitter:description" content="Almacenamiento rápido y seguro para tus archivos.">

    <!-- Estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- Favicon (Icono de nube genérico) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
</head>
<body>

    <!-- Pantalla de Carga Inicial -->
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
    </div>

    <!-- Login -->
    <section id="login-screen" class="screen">
        <div class="glass-panel login-box">
            <div class="logo-big">m0t.dw</div>
            <p class="subtitle">Infraestructura Cloud Híbrida</p>
            <div class="features">
                <span><i class="fas fa-bolt"></i> Ultra Rápido</span>
                <span><i class="fas fa-shield-alt"></i> Seguro</span>
                <span><i class="fas fa-hdd"></i> +5GB por archivo</span>
            </div>
            <button id="btn-login" class="btn-google">
                <i class="fab fa-google"></i> Acceder con Google
            </button>
        </div>
    </section>

    <!-- Dashboard Principal -->
    <section id="dashboard" class="screen" style="display: none;">
        <nav class="navbar">
            <div class="nav-brand">m0t.dw <span class="badge">PRO</span></div>
            <div class="nav-user">
                <span id="user-name">Cargando...</span>
                <img id="user-photo" src="" alt="Avatar">
                <button id="btn-logout" title="Cerrar Sesión"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </nav>

        <main class="container">
            <!-- Zona de Subida -->
            <div class="upload-card">
                <div class="drop-zone" id="drop-zone">
                    <div class="icon-cloud"><i class="fas fa-cloud-upload-alt"></i></div>
                    <h3>Arrastra tus archivos aquí</h3>
                    <p>Soporte para archivos pesados (Blob Direct Stream)</p>
                    <button class="btn-select" onclick="document.getElementById('file-input').click()">Seleccionar Archivo</button>
                    <input type="file" id="file-input" hidden>
                </div>

                <!-- Progreso -->
                <div class="upload-status" id="upload-status" style="display: none;">
                    <div class="status-header">
                        <span id="status-filename">Subiendo archivo...</span>
                        <span id="status-percent">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-bar"></div>
                    </div>
                    <p id="status-text" class="status-detail">Conectando con servidor...</p>
                </div>
            </div>

            <!-- Lista de Archivos -->
            <div class="files-section">
                <div class="section-header">
                    <h2><i class="fas fa-folder-open"></i> Mi Unidad</h2>
                    <span id="file-count" class="file-count">0 archivos</span>
                </div>
                <ul id="file-list" class="file-list">
                    <!-- Los archivos se generan aquí -->
                </ul>
            </div>
        </main>
    </section>

    <!-- Firebase SDKs (Versión 8 compatible) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- Lógica de la App -->
    <script src="app.js"></script>
</body>
</html>
